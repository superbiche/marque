[package]
name = "marque"
version = "0.4.6"
description = "A fast desktop markdown viewer with folder workspaces"
authors = ["Michel Tomas"]
edition = "2021"

[lib]
name = "marque_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-single-instance = "2"
tauri-plugin-drag = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
notify = "8"
notify-debouncer-full = "0.7"
nucleo = "0.5"
ignore = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.13"
dirs = "6"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
