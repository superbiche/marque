name: Bug report
description: Something renders wrong, crashes, or misbehaves.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: markdown
    attributes:
      label: Markdown sample
      description: The smallest markdown snippet that reproduces a rendering issue, if applicable.
      render: markdown
  - type: input
    id: version
    attributes:
      label: Marque version
      description: From the About dialog, the package name, or `git rev-parse --short HEAD` for a source build.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Distribution and version, desktop environment, Wayland or X11, install method (deb, rpm, AppImage, source).
      placeholder: Fedora 44, KDE Plasma, Wayland, rpm
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of running `marque` from a terminal, if any.
      render: shell
