name: Release

# A release starts from a maintainer-signed annotated tag `vX.Y.Z` on main.
# verify -> gates -> build (Linux x64/arm64, macOS universal, Windows x64)
# -> stage (inventory, SBOM, SHA256SUMS) -> publish (provenance, draft,
# upload, check, publish). Nothing becomes public until every asset exists and
# matches SHA256SUMS; a failure leaves at most an unpublished draft.
#
# workflow_dispatch: `dry_run` (default) runs every stage except publish and
# builds the dispatched branch head, so the pipeline can be exercised from a
# pull request branch without releasing; with `dry_run: false` it (re)publishes
# an existing tag whose release is missing or still a draft.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing signed tag to verify (and release when dry_run is false), e.g. v0.5.0"
        required: true
        type: string
      dry_run:
        description: "Build and stage only; publish nothing"
        required: false
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
      sha: ${{ steps.verify.outputs.sha }}
      prerelease: ${{ steps.verify.outputs.prerelease }}
      build_ref: ${{ steps.ref.outputs.build_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The trusted fingerprint is a repository variable (admin-only), not a
      # file in the tagged tree; the public key comes from the owner's GitHub
      # account. Expressions reach the shell only through env.
      - name: Verify the signed tag
        id: verify
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_FPR: ${{ vars.RELEASE_SIGNING_FINGERPRINT }}
          SIGNER_KEYS_URL: https://github.com/${{ github.repository_owner }}.gpg
        run: scripts/release/verify-tag.sh

      - name: Choose the source to build
        id: ref
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TAG_SHA: ${{ steps.verify.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: building the dispatched head $HEAD_SHA"
            echo "build_ref=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "build_ref=$TAG_SHA" >> "$GITHUB_OUTPUT"
          fi

  gates:
    needs: [verify]
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.verify.outputs.build_ref }}

  # ubuntu-22.04 on purpose: the Linux bundles link against the build host's
  # glibc, and 22.04 keeps the floor at 2.35 (Ubuntu 22.04, Debian 12).
  build:
    needs: [verify, gates]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - name: linux-arm64
            os: ubuntu-22.04-arm
            bundles: deb,rpm,appimage
          - name: macos-universal
            os: macos-15
            bundles: dmg
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: windows-x64
            os: windows-2022
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.build_ref }}

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          TARGET: ${{ matrix.target }}
        run: |
          args=(--bundles "$BUNDLES")
          [ -n "$TARGET" ] && args+=(--target "$TARGET")
          pnpm tauri build "${args[@]}"

      - name: Collect bundles
        shell: bash
        env:
          OUT_DIR: release-assets
        run: scripts/release/collect-bundles.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-${{ matrix.name }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  stage:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.build_ref }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundles-*
          path: release-assets
          merge-multiple: true

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: release-assets/Marque_${{ needs.verify.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Check inventory and write SHA256SUMS
        env:
          ASSET_DIR: release-assets
          VERSION: ${{ needs.verify.outputs.version }}
        run: scripts/release/stage.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-staged
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [verify, stage]
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-staged
          path: release-assets

      - name: Check staged digests
        working-directory: release-assets
        run: sha256sum --quiet -c SHA256SUMS

      # Provenance for every asset listed in SHA256SUMS, bound to this
      # repository, this workflow and the tagged commit.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-assets/SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          SHA: ${{ needs.verify.outputs.sha }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          EXPECTED_FPR: ${{ vars.RELEASE_SIGNING_FINGERPRINT }}
          ASSET_DIR: release-assets
        run: scripts/release/publish.sh
